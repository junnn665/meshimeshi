<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飯飯食堂｜東海・名古屋のおいしい話題まとめ</title>
<meta name="description" content="デカ盛り、行列店、新店、チェーンやコンビニの新作、安うまグルメ。東海・名古屋のグルメニュースを1時間ごとに自動でまとめる非公式サイト">
<meta name="theme-color" content="#FFC93C">
<meta property="og:title" content="飯飯食堂">
<meta property="og:description" content="東海・名古屋のおいしい話題を1時間ごとに自動でまとめるサイト">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div>
      <p class="tagline">東海・名古屋のおいしい話題まとめ</p>
      <h1 class="logo">飯飯食堂</h1>
    </div>
    <p class="update-note">1時間ごとに自動更新</p>
  </div>
</header>

<div class="ticker" id="ticker" hidden>
  <div class="wrap ticker-inner">
    <span class="ticker-badge">● 速報</span>
    <a class="ticker-text" id="ticker-text" href="#" target="_blank" rel="noopener"></a>
  </div>
</div>

<main class="wrap main">
  <section class="gacha" id="gacha" aria-labelledby="gacha-heading">
    <div class="gacha-head">
      <h2 class="gacha-heading" id="gacha-heading"><span class="gacha-small">今日なに食べる？</span>飯ガチャ</h2>
      <p class="gacha-lead">エリアとジャンルを選んで回すと、ニュースで話題のお店を1軒選びます。</p>
    </div>
    <div class="gacha-body">
      <div class="gacha-controls">
        <p class="g-label" id="g-area-label">エリア</p>
        <div class="g-pills" id="g-area" role="group" aria-labelledby="g-area-label"></div>
        <p class="g-label" id="g-genre-label">ジャンル</p>
        <div class="g-pills" id="g-genre" role="group" aria-labelledby="g-genre-label"></div>
        <button type="button" class="g-spin" id="g-spin">ガチャを回す</button>
        <p class="g-pool" id="g-pool" aria-live="polite"></p>
      </div>
      <div class="gacha-stage">
        <div class="machine" id="machine" aria-hidden="true">
          <div class="dome">
            <span class="cap" style="--c:#C2410C;left:14%;top:52%"></span>
            <span class="cap" style="--c:#1D4ED8;left:38%;top:58%"></span>
            <span class="cap" style="--c:#3F6212;left:62%;top:54%"></span>
            <span class="cap" style="--c:#86198F;left:24%;top:30%"></span>
            <span class="cap" style="--c:#A16207;left:50%;top:34%"></span>
            <span class="cap" style="--c:#B91C1C;left:72%;top:28%"></span>
            <span class="cap" style="--c:#FFC93C;left:40%;top:12%"></span>
          </div>
          <div class="base">
            <span class="plate">飯ガチャ</span>
            <span class="handle"><span class="grip"></span></span>
            <span class="outlet"></span>
          </div>
          <span class="drop" id="drop"><span class="cap-top"></span><span class="cap-bottom"></span></span>
        </div>
        <div class="g-result" id="g-result" hidden></div>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>

  <div class="tools">
    <form class="search" id="search-form" role="search">
      <label class="visually-hidden" for="q">キーワードで探す</label>
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="ラーメン、栄、モーニング…" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="tool-row">
      <div class="areas" id="areas" role="group" aria-label="エリア"></div>
      <button type="button" class="saved-toggle" id="saved-toggle" aria-pressed="false" aria-label="行きたいリスト"><span class="saved-label">行きたい</span> <span class="saved-count" id="saved-count">0</span></button>
    </div>
  </div>

  <div class="list-head">
    <h2 id="heading">すべてのニュース</h2>
    <span class="new-count" id="new-count" hidden></span>
    <button type="button" class="refresh" id="refresh">↻ 最新に更新</button>
  </div>
  <p class="lead">デカ盛り、行列店、新店、チェーンやコンビニの新作、安うまグルメ。東海エリアの話題を中心に、ニュースサイトや企業の発表から1時間ごとに自動で集めます。</p>
  <p class="status" id="status">ニュースを読み込み中…</p>

  <div class="grid" id="grid"></div>
  <button type="button" class="more" id="more" hidden>もっと見る</button>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>各記事は要約です。詳細は出典元のページをご確認ください。掲載店舗・企業とは関係のない個人の非公式サイトです。</p>
    <p id="updated"></p>
    <p>© 飯飯食堂</p>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
