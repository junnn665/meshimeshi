<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飯ガチャ｜飯飯食堂</title>
<meta name="description" content="エリア・ジャンル・予算を選んで回すと、東海・名古屋のお店を1軒選ぶ飯ガチャ">
<meta name="theme-color" content="#2B2118">
<meta property="og:title" content="飯ガチャ｜飯飯食堂">
<meta property="og:description" content="今日なに食べる？ 迷ったら飯ガチャで決めよう">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="gacha-page">
<header class="mini-header">
  <div class="wrap mini-inner">
    <a class="mini-logo" href="./">飯飯食堂</a>
    <nav class="mini-nav" aria-label="サイト">
      <a href="./">記事一覧</a>
      <a href="./#saved">行きたい</a>
    </nav>
  </div>
</header>

<main class="wrap main">
  <section class="gacha" id="gacha" aria-labelledby="gacha-heading">
    <div class="gacha-head">
      <h1 class="gacha-heading" id="gacha-heading"><span class="gacha-small">今日なに食べる？</span>飯ガチャ</h1>
      <p class="gacha-lead">エリアとジャンル、予算を選んで回すと、今日のお店を1軒選びます。</p>
    </div>
    <div class="gacha-body">
      <div class="gacha-controls">
        <p class="g-label" id="g-area-label">エリア</p>
        <div class="g-pills" id="g-area" role="group" aria-labelledby="g-area-label"></div>
        <p class="g-label" id="g-genre-label">ジャンル</p>
        <div class="g-pills" id="g-genre" role="group" aria-labelledby="g-genre-label"></div>
        <p class="g-label" id="g-budget-label">予算（夜）</p>
        <div class="g-pills" id="g-budget" role="group" aria-labelledby="g-budget-label"></div>
        <button type="button" class="g-spin" id="g-spin">ガチャを回す</button>
        <p class="g-pool" id="g-pool" aria-live="polite"></p>
      </div>
      <div class="gacha-stage">
        <div class="machine" id="machine" aria-hidden="true">
          <div class="dome">
            <span class="cap" style="--c:#C2410C;left:14%;top:52%"></span>
            <span class="cap" style="--c:#1D4ED8;left:38%;top:58%"></span>
            <span class="cap" style="--c:#3F6212;left:62%;top:54%"></span>
            <span class="cap" style="--c:#86198F;left:24%;top:30%"></span>
            <span class="cap" style="--c:#A16207;left:50%;top:34%"></span>
            <span class="cap" style="--c:#B91C1C;left:72%;top:28%"></span>
            <span class="cap" style="--c:#FFC93C;left:40%;top:12%"></span>
          </div>
          <div class="base">
            <span class="plate">飯ガチャ</span>
            <span class="handle"><span class="grip"></span></span>
            <span class="outlet"></span>
          </div>
          <span class="drop" id="drop"><span class="cap-top"></span><span class="cap-bottom"></span></span>
        </div>
        <div class="g-result" id="g-result" hidden></div>
      </div>
    </div>
    <p class="g-credit">
      <a href="https://webservice.recruit.co.jp/" target="_blank" rel="noopener"><img src="https://webservice.recruit.co.jp/banner/hotpepper-s.gif" alt="ホットペッパーグルメ Webサービス" width="135" height="17" title="ホットペッパーグルメ Webサービス"></a>
      <span>お店の情報は ホットペッパーグルメ Webサービス から取得しています（1日1回更新）。</span>
    </p>
  </section>

  <a class="back-link" href="./">← 記事一覧にもどる</a>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>お店の情報はホットペッパーグルメ Webサービスから取得しています。最新の営業時間などは各お店のページでご確認ください。掲載店舗・企業とは関係のない個人の非公式サイトです。</p>
    <p>© 飯飯食堂</p>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
